<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="{{ page.title }}">
    <!-- <meta property="og:description" content="{{ page.description | default: site.description }}"> -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url }}">
    <meta property="og:image" content="{{ site.baseurl }}/assets/images/Favicon(300x300)(light).png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <!-- <meta name="twitter:description" content="{{ page.description | default: site.description }}"> -->
    <meta name="twitter:image" content="{{ site.baseurl }}/assets/images/Favicon(300x300)(light).png">

    <!-- Theme-aware favicons for desktop browsers -->
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/Favicon(300x300)(light).png" media="(prefers-color-scheme: light)" id="favicon-light">
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/Favicon(300x300)(dark).png" media="(prefers-color-scheme: dark)" id="favicon-dark">
    <!-- Fallback favicon for mobile browsers (must come last for Safari) -->
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/Favicon(300x300)(light).png" id="favicon-default">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/Favicon(300x300)(light).png">
    <!-- Web App Manifest for Android Chrome -->
    <link rel="manifest" href="{{ site.baseurl }}/manifest.json">
    <script>
      // Fix favicon for Safari iOS which doesn't support media queries on favicon links
      (function() {
        var favicon = document.getElementById('favicon-default');
        if (favicon && window.matchMedia) {
          var darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          favicon.href = darkMode ? '{{ site.baseurl }}/assets/images/DS_Dark.png' : '{{ site.baseurl }}/assets/images/DS306.png';
          
          // Listen for changes
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            favicon.href = e.matches ? '{{ site.baseurl }}/assets/images/DS_Dark.png' : '{{ site.baseurl }}/assets/images/DS306.png';
          });
        }
      })();
      
      // Force home button to stay fixed on scroll
      (function() {
        var homeButton = document.querySelector('.home-button');
        if (homeButton) {
          var updatePosition = function() {
            homeButton.style.position = 'fixed';
            homeButton.style.top = window.innerWidth <= 700 ? '10px' : '15px';
            homeButton.style.left = window.innerWidth <= 700 ? '5px' : '10px';
          };
          
          updatePosition();
          window.addEventListener('scroll', updatePosition, { passive: true });
          window.addEventListener('resize', updatePosition);
        }
      })();
    </script>
    <style>
      html {
        position: relative;
      }
      
      body {
        margin: 40px 0 0 100px;
        max-width: 525px;
        line-height: 1.5;
        font-size: 15px;
        color: rgb(246, 243, 236);
        background-color: rgb(41, 36, 30);
        font-family: Georgia, "Times New Roman", Times, serif;
        position: relative;
      }

      h1, h2, h3 {
        line-height: 1.25;
      }

      a {
        color: #74d8ff;
        text-decoration: underline;
      }

      a:visited {
        color: #c285ff;
      }

      li p {
        margin: 0;
      }

      img {
        max-width: 100%;
        height: auto;
        width: auto;
      }

      .home-button {
        position: fixed !important;
        top: 15px !important;
        left: 10px !important;
        right: auto !important;
        bottom: auto !important;
        font-size: 13px;
        padding: 5px 10px;
        background-color: rgba(41, 36, 30, 0.8);
        border: 1px solid rgba(116, 216, 255, 0.3);
        border-radius: 3px;
        text-decoration: none;
        color: #74d8ff;
        z-index: 9999;
        transition: background-color 0.2s;
        margin: 0;
        display: inline-block;
      }

      .home-button:hover {
        background-color: rgba(41, 36, 30, 0.95);
        border-color: rgba(116, 216, 255, 0.5);
      }

      .content-wrapper {
        padding-top: 0;
      }

      body.has-home-button .content-wrapper {
        padding-top: 30px;
      }

      @media (max-width: 700px) {
        body {
          margin: 20px;
          line-height: 1.7;
        }
        .home-button {
          top: 10px !important;
          left: 5px !important;
          font-size: 14px;
          padding: 5px 9px;
        }
        body.has-home-button .content-wrapper {
          padding-top: 25px;
        }
      }
    </style>
  </head>
  <body{% unless page.url == '/' or page.url == '/index.html' %} class="has-home-button"{% endunless %}>
    {% unless page.url == '/' or page.url == '/index.html' %}
    <a href="https://www.dansagher.com" class="home-button">home</a>
    {% endunless %}
    <div class="content-wrapper">
      {{ content }}
    </div>
  </body>
</html>
