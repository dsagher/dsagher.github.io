<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:title" content="{{ page.title }}">
    <!-- <meta property="og:description" content="{{ page.description | default: site.description }}"> -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url }}">
    <meta property="og:image" content="{{ site.baseurl }}/assets/images/DS306.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <!-- <meta name="twitter:description" content="{{ page.description | default: site.description }}"> -->
    <meta name="twitter:image" content="{{ site.baseurl }}/assets/images/DS306.png">

    <!-- Fallback favicon for mobile browsers that don't support media queries -->
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/DS306.png">
    <!-- Theme-aware favicons for desktop browsers -->
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/DS306.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/DS_Dark.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/DS306.png">
    <!-- Web App Manifest for Android Chrome -->
    <link rel="manifest" href="{{ site.baseurl }}/manifest.json">
    <style>
      body {
        margin: 40px 0 0 100px;
        max-width: 525px;
        line-height: 1.5;
        font-size: 15px;
        color: rgb(246, 243, 236);
        background-color: rgb(41, 36, 30);
        font-family: Georgia, "Times New Roman", Times, serif;
      }

      h1, h2, h3 {
        line-height: 1.25;
      }

      a {
        color: #74d8ff;
        text-decoration: underline;
      }

      a:visited {
        color: #c285ff;
      }

      li p {
        margin: 0;
      }

      img {
        max-width: 100%;
        height: auto;
        width: auto;
      }

      .home-button {
        position: fixed;
        top: 10px;
        left: 10px;
        font-size: 12px;
        padding: 4px 8px;
        background-color: rgba(41, 36, 30, 0.8);
        border: 1px solid rgba(116, 216, 255, 0.3);
        border-radius: 3px;
        text-decoration: none;
        color: #74d8ff;
        z-index: 1000;
        transition: background-color 0.2s;
      }

      .home-button:hover {
        background-color: rgba(41, 36, 30, 0.95);
        border-color: rgba(116, 216, 255, 0.5);
      }

      @media (max-width: 700px) {
        body {
          margin: 20px;
          line-height: 1.7;
        }
        .home-button {
          top: 5px;
          left: 5px;
          font-size: 11px;
          padding: 3px 6px;
        }
      }
    </style>
  </head>
  <body>
    {% unless page.url == '/' or page.url == '/index.html' %}
    <a href="https://www.dansagher.com" class="home-button">home</a>
    {% endunless %}
    {{ content }}
  </body>
</html>
